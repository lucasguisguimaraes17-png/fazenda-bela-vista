  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

L: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radi lass=\"nav\" style=\"border-bottom:1px solid var(--color-divider);position:sticky;top:0;z-index:20;background:var(--color-bg);flex-wrap:wrap;row-gap:8px\">\n    <div class=\"nav-brand\" style=\"display:flex;align-items:center;gap:10px\">\n      <button class=\"rc-hamburger btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ onToggleDrawer }}\" style=\"flex-direction:column;justify-content:center;gap:4px;padding:8px\" aria-label=\"Menu\">\n        <span style=\"width:18px;height:2px;background:var(--color-text);border-radius:2px\"><\u002Fspan>\n        <span style=\"width:18px;height:2px;background:var(--color-text);border-radius:2px\"><\u002Fspan>\n        <span style=\"width:18px;height:2px;background:var(--color-text);border-radius:2px\"><\u002Fspan>\n      <\u002Fbutton>\n      <img src=\"183fe145-d87a-49f9-bab1-9c94ade87f11\" alt=\"Fazenda Bela Vista\" style=\"height:40px;width:40px;object-fit:cover;border-radius:999px;background:var(--color-bg)\">\n      <span>Fazenda Bela Vista — Sistema de Gestão da Recria<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tag tag-accent-2\">{{ pesoArrobaLabel }}<\u002Fdiv>\n    <a href=\"./calculadora-socios.html\" class=\"btn btn-secondary\" style=\"text-decoration:none\" data-desktop-only=\"true\">Calculadora Sócios<\u002Fa>\n    <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ onToggleHelp }}\" title=\"Ajuda\">?<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showHelp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ onToggleHelp }}\">\n      <div class=\"dialog\" style=\"max-width:520px\" sc-camel-on-click=\"{{ stopProp }}\">\n        <div class=\"dialog-title\">Como usar<\u002Fdiv>\n        <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <p style=\"margin:0\"><strong>Lotes<\u002Fstrong> — cadastre cada grupo de animais (entrada, piquete). Feche o lote quando vender.<\u002Fp>\n          <p style=\"margin:0\"><strong>Pesagens<\u002Fstrong> — a cada pesagem, lance data e peso por animal. GMD e curva de ganho calculam sozinhos.<\u002Fp>\n          <p style=\"margin:0\"><strong>Custos<\u002Fstrong> — lance cada gasto por categoria. O resumo e o custo por @ se atualizam sozinhos.<\u002Fp>\n          <p style=\"margin:0\"><strong>Simulação de Venda<\u002Fstrong> — preencha o preço de venda da arroba pra ver o lucro estimado.<\u002Fp>\n          <div class=\"hr\" style=\"margin:8px 0\"><\u002Fdiv>\n          <p style=\"margin:0;font-size:13px\" class=\"text-muted\">Metas técnicas de referência: GMD alvo 0,500–0,800 kg/dia · suplementação 0,3–1,0% do peso vivo/dia · pesagens a cada 28–30 dias · vermifugação a cada 60–90 dias.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onToggleHelp }}\">Entendi<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"rc-toptabs\" style=\"gap:8px;padding:12px 24px 14px;overflow-x:auto\">\n    <sc-for list=\"{{ tabsList }}\" as=\"t\" hint-placeholder-count=\"7\">\n      <button class=\"btn rc-tabbtn {{ t.activeClass }}\" sc-camel-on-click=\"{{ t.onClick }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div class=\"rc-content\" style=\"flex:1;padding:0 24px 64px;max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box\">\n\n    <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"text-muted\">Carregando dados da recria…<\u002Fp>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabIsDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:8px 0 16px\">Dashboard<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px\">\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Animais ativos<\u002Fdiv><div class=\"card-title\">{{ totalAnimaisFmt }}<\u002Fdiv><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Arrobas produzidas<\u002Fdiv><div class=\"card-title\">{{ totalArrobasFmt }} @<\u002Fdiv><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Custo total geral<\u002Fdiv><div class=\"card-title\">{{ totalCustoFmt }}<\u002Fdiv><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Custo por @ (geral)<\u002Fdiv><div class=\"card-title\">{{ custoPorArrobaGeralFmt }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ lotesComMetricas }}\" as=\"lc\" hint-placeholder-count=\"1\">\n        <div class=\"card elev-md\" style=\"margin-bottom:18px;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div class=\"card-title\" style=\"font-size:22px\">Lote {{ lc.id }}<\u002Fdiv>\n            <span class=\"tag {{ lc.statusTag }}\">{{ lc.m.status }}<\u002Fspan>\n            <span class=\"tag tag-outline\">{{ lc.categoria }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px\">\n            <div><div class=\"card-meta\">Peso entrada<\u002Fdiv><div style=\"font-size:18px\">{{ lc.pesoEntradaFmt }} kg<\u002Fdiv><\u002Fdiv>\n            <div><div class=\"card-meta\">Peso atual<\u002Fdiv><div style=\"font-size:18px\">{{ lc.pesoAtualFmt }} kg<\u002Fdiv><\u002Fdiv>\n            <div><div class=\"card-meta\">GMD médio<\u002Fdiv><div style=\"font-size:18px\">{{ lc.gmdFmt }} kg/dia<\u002Fdiv><\u002Fdiv>\n            <div><div class=\"card-meta\">Arrobas produzidas<\u002Fdiv><div style=\"font-size:18px\">{{ lc.arrobasFmt }} @<\u002Fdiv><\u002Fdiv>\n            <div><div class=\"card-meta\">Custo total<\u002Fdiv><div style=\"font-size:18px\">{{ lc.custoTotalFmt }}<\u002Fdiv><\u002Fdiv>\n            <div><div class=\"card-meta\">Custo por @<\u002Fdiv><div style=\"font-size:18px\">{{ lc.custoPorArrobaFmt }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ lc.chart.hasChart }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card-meta\" style=\"margin-top:4px\">Curva de peso médio (kg) por rodada de pesagem<\u002Fdiv>\n            <div style=\"position:relative;width:100%;margin-top:6px\">\n              <svg sc-camel-view-box=\"0 0 {{ lc.chart.width }} {{ lc.chart.height }}\" style=\"width:100%;height:180px;display:block\">\n                <line x1=\"44\" y1=\"{{ lc.chart.baselineY }}\" x2=\"{{ lc.chart.rightX }}\" y2=\"{{ lc.chart.baselineY }}\" stroke=\"var(--color-divider)\" stroke-width=\"1\"><\u002Fline>\n                <polyline points=\"{{ lc.chart.pointsStr }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.5\"><\u002Fpolyline>\n                <sc-for list=\"{{ lc.chart.dots }}\" as=\"d\" hint-placeholder-count=\"6\">\n                  <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"4\" fill=\"var(--color-accent-700)\"><\u002Fcircle>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <sc-for list=\"{{ lc.chart.yLabels }}\" as=\"yl\" hint-placeholder-count=\"2\">\n                <div style=\"position:absolute;left:0;top:{{ yl.topPct }}%;transform:translateY(-50%);font-size:10px;color:var(--color-text);opacity:0.6\">{{ yl.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ lc.chart.dots }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <div style=\"position:absolute;left:{{ d.leftPct }}%;top:{{ d.labelTopPct }}%;transform:translate(-50%,0);font-size:10px;color:var(--color-text);opacity:0.6;white-space:nowrap\">{{ d.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabIsLancamento }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:8px 0 16px\">Lançar Pesagem<\u002Fh2>\n      <p class=\"text-muted\" style=\"margin-top:-8px\">Registre rápido: lote, peso e identificação do animal (se tiver). Vai entrando na lista abaixo até salvar tudo de uma vez.<\u002Fp>\n\n      <div class=\"card elev-md\" style=\"margin-bottom:22px;gap:14px;max-width:520px\">\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <div class=\"field\" style=\"width:150px\">\n            <label>Data<\u002Flabel>\n            <input class=\"input\" type=\"date\" value=\"{{ lancData }}\" sc-camel-on-change=\"{{ onChangeLancData }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"width:130px\">\n            <label>Lote<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ lancLoteId }}\" sc-camel-on-change=\"{{ onChangeLancLote }}\">\n              <sc-for list=\"{{ lotesOptions }}\" as=\"lo\" hint-placeholder-count=\"1\">\n                <option value=\"{{ lo.id }}\">{{ lo.id }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end\">\n          <div class=\"field\" style=\"width:170px\">\n            <label>Identificação (opcional)<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"ex: Fev-01\" value=\"{{ lancAnimalId }}\" sc-camel-on-change=\"{{ onChangeLancAnimalId }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"width:120px\">\n            <label>Peso (kg)<\u002Flabel>\n            <input class=\"input\" type=\"number\" step=\"0.1\" placeholder=\"kg\" value=\"{{ lancPeso }}\" sc-camel-on-change=\"{{ onChangeLancPeso }}\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onAddLancEntry }}\">+ Adicionar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasLancPendentes }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-sm\" style=\"margin-bottom:16px;max-width:520px\">\n          <div class=\"card-title\">Pendentes de salvar ({{ lancPendentesCount }})<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:8px\">\n            <sc-for list=\"{{ lancPendentes }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:10px;background:var(--color-bg);padding:8px 10px;border-radius:10px\">\n                <span class=\"tag tag-outline\">{{ p.loteId }}<\u002Fspan>\n                <span style=\"flex:1;font-size:14px\">{{ p.label }}<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:700\">{{ p.pesoFmt }} kg<\u002Fspan>\n                <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ p.onRemove }}\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" style=\"margin-top:14px\" sc-camel-on-click=\"{{ onSalvarLancamentos }}\">Salvar todas<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabIsPesagens }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:8px 0 16px\">Pesagens<\u002Fh2>\n\n      <sc-if value=\"{{ showLoteSelector }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"field\" style=\"max-width:220px;margin-bottom:16px\">\n          <label>Lote<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ selectedLoteId }}\" sc-camel-on-change=\"{{ onSelectLote }}\">\n            <sc-for list=\"{{ lotesOptions }}\" as=\"lo\" hint-placeholder-count=\"1\">\n              <option value=\"{{ lo.id }}\">{{ lo.id }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasChart }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-sm\" style=\"margin-bottom:22px\">\n          <div class=\"card-title\">Curva de ganho de peso — Lote {{ selectedLoteId istro de sanidade<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:10px\">\n            <div class=\"field\" style=\"flex:1\"><label>Data<\u002Flabel><input class=\"input\" type=\"date\" value=\"{{ sanidadeModal.data }}\" sc-camel-on-change=\"{{ onSanidadeFieldData }}\"><\u002Fdiv>\n            <div class=\"field\" style=\"flex:1\">\n              <label>Lote<\u002Flabel>\n              <sc-raw-select class=\"input\" value=\"{{ sanidadeModal.loteId }}\" sc-camel-on-change=\"{{ onSanidadeFieldLoteId }}\">\n                <sc-for list=\"{{ lotesOptions }}\" as=\"lo\" hint-placeholder-count=\"1\"><option value=\"{{ lo.id }}\">{{ lo.id }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Tipo<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ sanidadeModal.tipo }}\" sc-camel-on-change=\"{{ onSanidadeFieldTipo }}\">\n              <option value=\"\">— selecionar —<\u002Foption>\n              <option value=\"Vacina\">Vacina<\u002Foption>\n              <option value=\"Vermífugo\">Vermífugo<\u002Foption>\n              <option value=\"Pour-on\">Pour-on<\u002Foption>\n              <option value=\"Mata-bicheira\">Mata-bicheira<\u002Foption>\n              <option value=\"Suplemento/mineral\">Suplemento/mineral<\u002Foption>\n              <option value=\"Outro\">Outro<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\"><label>Produto<\u002Flabel><input class=\"input\" type=\"text\" value=\"{{ sanidadeModal.produto }}\" sc-camel-on-change=\"{{ onSanidadeFieldProduto }}\"><\u002Fdiv>\n          <div class=\"field\"><label>Próxima aplicação<\u002Flabel><input class=\"input\" type=\"date\" value=\"{{ sanidadeModal.proximaAplicacao }}\" sc-camel-on-change=\"{{ onSanidadeFieldProxima }}\"><\u002Fdiv>\n          <div class=\"field\"><label>Observações<\u002Flabel><input class=\"input\" type=\"text\" value=\"{{ sanidadeModal.obs }}\" sc-camel-on-change=\"{{ onSanidadeFieldObs }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onCloseSanidadeModal }}\">Cancelar<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onSaveSanidadeModal }}\">Salvar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"rc-drawer-backdrop\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:29\" sc-camel-on-click=\"{{ onToggleDrawer }}\"><\u002Fdiv>\n    <div class=\"rc-drawer-panel\" style=\"position:fixed;top:0;left:0;bottom:0;width:min(78vw,300px);background:var(--color-accent-100);z-index:30;box-shadow:var(--shadow-lg);padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:6px 8px 14px\">\n        <img src=\"183fe145-d87a-49f9-bab1-9c94ade87f11\" style=\"height:30px;width:30px;object-fit:cover;border-radius:999px\">\n        <span style=\"font-family:var(--font-heading);font-size:13px;font-weight:700\">Bela Vista<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tabsList }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ t.onSelectAndClose }}\" style=\"text-align:left;background:{{ t.drawerBg }};border:none;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:{{ t.dotColor }};cursor:pointer\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <div class=\"hr\" style=\"margin:8px 0\"><\u002Fdiv>\n      <a href=\"./calculadora-socios.html\" style=\"text-align:left;background:none;border:none;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--color-accent-700);text-decoration:none\">Calculadora Sócios<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;max-width:min(92vw,520px)\">\n      <div class=\"card elev-lg\" style=\"padding:12px 16px;background:var(--color-accent-2-100);border:1px solid var(--color-accent-2-300)\">\n        <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline\">\n          <span class=\"tag tag-accent-2\">Salvo às {{ toastWhen }}<\u002Fspan>\n          <button class=\"btn btn-icon btn-ghost\" style=\"width:22px;height:22px\" sc-camel-on-click=\"{{ onDismissToast }}\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;margin-top:6px\">{{ toastText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasConfirmDelete }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\">\n      <div class=\"dialog\" style=\"max-width:360px\">\n        <div class=\"dialog-title\">Excluir?<\u002Fdiv>\n        <div class=\"dialog-body\">Tem certeza que deseja excluir \"{{ confirmDeleteLabel }}\"? Essa ação não pode ser desfeita.<\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onConfirmDeleteNo }}\">Cancelar<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onConfirmDeleteYes }}\">Excluir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{},&quot;pesoArroba&quot;:{&quot;editor&quot;:&quot;number&quot;,&quot;default&quot;:30,&quot;min&quot;:15,&quot;max&quot;:30,&quot;step&quot;:15,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;kg&quot;,&quot;section&quot;:&quot;Parâmetros&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;lancamento&quot;,&quot;pesagens&quot;,&quot;lotes&quot;,&quot;custos&quot;,&quot;periodo&quot;,&quot;venda&quot;,&quot;sanidade&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Parâmetros&quot;},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;terracota&quot;,&quot;options&quot;:[&quot;terracota&quot;,&quot;vinho&quot;,&quot;azul&quot;,&quot;dourado&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;fundo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;areia&quot;,&quot;options&quot;:[&quot;creme&quot;,&quot;areia&quot;,&quot;claro&quot;,&quot;escuro&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;}}\">\n\nclass Component extends DCLogic {\n  state = {\n    loaded: false,\n    lotes: [], pesagens: [], custos: [], sanidade: [], venda: {},\n    tab: (this.props && this.props.defaultTab) || 'dashboard',\n    selectedLoteId: null,\n    novaPesagemData: '', novaPesagemLote: null,\n    pesoInputs: {}, novosAnimais: [],\n    loteModal: null, custoModal: null, sanidadeModal: null, confirmDelete: null,\n    expandedRound: null,\n    expandedCustoId: null,\n    showHelp: false,\n    drawerOpen: false,\n    toast: null,\n    projecaoMeses: {},\n    projecaoTaxaProteinado: {},\n  };\n\n  async componentDidMount() {\n    this.STORAGE_KEY = 'recria_dados_v1';\n    try {\n      this.sb = window.supabase.createClient('https://imsokocmxqsmmkbqoqct.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imltc29rb2NteHFzbW1rYnFvcWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjg5NDAsImV4cCI6MjEwMDkwNDk0MH0.NvNgqJlhDnsz2Rh1b8qhTTJe8aSE4bSHxxL8sx7cZ2c');\n    } catch (e) {}\n    let mod = null;\n    try { mod = await import('./recria-data.js'); } catch (e) { console.warn('recria-data.js indisponível', e); }\n    this.dataMod = mod || { LOTES_INICIAIS: [], PESAGENS_INICIAIS: [], CUSTOS_INICIAIS: [], SANIDADE_INICIAL: [], VENDA_INICIAL: {}, CATEGORIAS_CUSTO: [\"Fubá de Milho\",\"Soja\",\"Núcleo\",\"Ureia\",\"Sanidade\",\"Mão de Obra\",\"Pasto/Insumos\",\"Outros\"], METAS: { supMin: 0.003, supMax: 0.01 } };\n    let saved = null;\n    if (this.sb) {\n      try {\n        const { data } = await this.sb.from('app_state').select('value').eq('key', this.STORAGE_KEY).maybeSingle();\n        if (data && data.value) saved = data.value;\n      } catch (e) {}\n    }\n    if (!saved) {\n      try { saved = JSON.parse(localStorage.getItem(this.STORAGE_KEY)); } catch (e) {}\n    }\n\n    let lotes, pesagens, custos, sanidade, venda;\n    if (saved && saved.lotes) {\n      lotes = saved.lotes; pesagens = saved.pesagens; custos = saved.custos; sanidade = saved.sanidade; venda = saved.venda || {};\n    } else {\n      lotes = mod.LOTES_INICIAIS.map(l => ({ ...l }));\n      pesagens = mod.PESAGENS_INICIAIS.map((p, i) => ({ ...p, id: 'p' + i }));\n      custos = mod.CUSTOS_INICIAIS.map((c, i) => ({ ...c, id: 'c' + i }));\n      sanidade = mod.SANIDADE_INICIAL.map((s, i) => ({ ...s, id: 's' + i }));\n      venda = JSON.parse(JSON.stringify(mod.VENDA_INICIAL || {}));\n    }\n    const firstLote = lotes[0] || null;\n    this.setState({\n      loaded: true, lotes, pesagens, custos, sanidade, venda,\n      selectedLoteId: firstLote ? firstLote.id : null,\n      novaPesagemLote: firstLote ? firstLote.id : null,\n      novaPesagemData: this.todayISO(),\n    });\n  }\n\n  persist() {\n    const payload = {\n      lotes: this.state.lotes, pesagens: this.state.pesagens, custos: this.state.custos,\n      sanidade: this.state.sanidade, venda: this.state.venda\n    };\n    try { localStorage.setItem(this.STORAGE_KEY || 'recria_dados_v1', JSON.stringify(payload)); } catch (e) {}\n    if (this.sb) {\n      this.sb.from('app_state').upsert({ key: this.STORAGE_KEY, value: payload, updated_at: new Date().toISOString() })\n        .then(({ error }) => { if (error) console.warn('Erro ao sincronizar com a nuvem', error); });\n    }\n  }\n\n  getThemeVars() {\n    const THEMES = {\n      terracota: null,\n      vinho: {\n        '--color-bg': '#f7e9e3', '--color-surface': '#efd6cd',\n        '--color-accent': '#b94f4f', '--color-accent-100': '#fbeaea', '--color-accent-200': '#f6d2d2', '--color-accent-300': '#eaa9a9', '--color-accent-400': '#d97878', '--color-accent-500': '#b94f4f', '--color-accent-600': '#963939', '--color-accent-700': '#742929', '--color-accent-800': '#4f1b1b', '--color-accent-900': '#2f0f0f'\n      },\n      azul: {\n        '--color-bg': '#eef3f6', '--color-surface': '#dee9ef',\n        '--color-accent': '#4f97cf', '--color-accent-100': '#eaf3fb', '--color-accent-200': '#d3e7f7', '--color-accent-300': '#a9d2f0', '--color-accent-400': '#7ab8e6', '--color-accent-500': '#4f97cf', '--color-accent-600': '#3a76ab', '--color-accent-700': '#2b5680', '--color-accent-800': '#1e3c5c', '--color-accent-900': '#12253a',\n        '--color-accent-2': '#d67f48', '--color-accent-2-100': '#fff2eb', '--color-accent-2-200': '#ffe1d0', '--color-accent-2-300': '#ffc6a5', '--color-accent-2-400': '#f6a06b', '--color-accent-2-500': '#d67f48', '--color-accent-2-600': '#b2622d', '--color-accent-2-700': '#8c491a', '--color-accent-2-800': '#643312', '--color-accent-2-900': '#402310'\n      },\n      dourado: {\n        '--color-bg': '#faf1de', '--color-surface': '#f0e2bf',\n        '--color-accent': '#d99a3a', '--color-accent-100': '#fdf3df', '--color-accent-200': '#fbe6bd', '--color-accent-300': '#f5d08a', '--color-accent-400': '#e9b45a', '--color-accent-500': '#d99a3a', '--color-accent-600': '#b37b28', '--color-accent-700': '#8c5f1e', '--color-accent-800': '#644413', '--color-accent-900': '#3d290b'\n      }\n    };\n    return THEMES[this.props.tema] || null;\n  }\n\n  getBgVars() {\n    const FUNDOS = {\n      creme: null,\n      areia: { '--color-bg': '#efe3ce', '--color-surface': '#e3d3b6' },\n      claro: { '--color-bg': '#faf7f0', '--color-surface': '#f0e9d8' },\n      escuro: { '--color-bg': '#2b2621', '--color-surface': '#3a332b', '--color-text': '#f2ebdd', '--color-divider': '#4a4237' }\n    };\n    return FUNDOS[this.props.fundo] || null;\n  }\n\n  todayISO() { return new Date().toISOString().slice(0, 10); }\n  showToast(text) {\n    const id = Date.now();\n    this.setState({ toast: { id, text, when: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) } });\n    setTimeout(() => { if (this.state.toast && this.state.toast.id === id) this.setState({ toast: null }); }, 6000);\n  }\n  genId(p) { return p + '_' + Date.now() + '_' + Math.floor(Math.random() * 100000); }\n  getPesoArroba() { return this.props.pesoArroba || 30; }\n\n  fmtNum(n, d) {\n    if (n == null || isNaN(n)) return '—';\n    return n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });\n  }\n  fmtMoney(n) {\n    if (n == null || isNaN(n)) return '—';\n    return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  }\n  fmtDate(iso) {\n    if (!iso) return '—';\n    const parts = iso.split('-');\n    if (parts.length !== 3) return iso;\n    return `${parts[2]}/${parts[1]}/${parts[0]}`;\n  }\n  daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }\n  fmtMonthShort(iso) {\n    if (!iso) return '';\n    const d = new Date(iso + 'T00:00:00Z');\n    return d.toLocaleDateString('pt-BR', { month: 'short', day: '2-digit', timeZone: 'UTC' }).replace('.', '');\n  }\n\n  computeRounds(loteId) {\n    const pes = this.state.pesagens.filter(p => p.loteId === loteId);\n    const byDate = {};\n    for (const p of pes) { (byDate[p.data] = byDate[p.data] || []).push(p); }\n    const dates = Object.keys(byDate).sort();\n    const arroba = this.getPesoArroba();\n    let rounds = [];\n    let prevAvg = null, prevDate = null;\n    dates.forEach((date, idx) => {\n      const entries = byDate[date];\n      const qty = entries.length;\n      const avg = entries.reduce((s, e) => s + e.peso, 0) / qty;\n      let ganho = null, gmdPeriodo = null, arrobas = null, custoPeriodo = null, custoPorArroba = null;\n      if (prevAvg != null) {\n        ganho = avg - prevAvg;\n        const dias = this.daysBetween(prevDate, date);\n        gmdPeriodo = dias > 0 ? ganho / dias : null;\n        arrobas = ganho * qty / arroba;\n        const custosPeriodo = this.state.custos.filter(c => c.loteId === loteId && c.data > prevDate && c.data <= date);\n        custoPeriodo = custosPeriodo.reduce((s, c) => s + c.valor, 0);\n        custoPorArroba = arrobas ? custoPeriodo / arrobas : null;\n        var custoPorCategoria = {};\n        custosPeriodo.forEach(c => { custoPorCategoria[c.categoria] = (custoPorCategoria[c.categoria] || 0) + c.valor; });\n      }\n      rounds.push({\n        round: idx + 1, date, avg, qty, ganho, gmdPeriodo, arrobas, custoPeriodo, custoPorArroba,\n        custoPorCategoria: custoPorCategoria || {},\n        entries: entries.slice().sort((a, b) => a.animal.localeCompare(b.animal, 'pt-BR', { numeric: true }))\n      });\n      prevAvg = avg; prevDate = date;\n    });\n    return rounds;\n  }\n\n  computeLoteMetrics(lote) {\n    const arroba = this.getPesoArroba();\n    const rounds = this.computeRounds(lote.id);\n    const status = lote.dataSaida ? 'Vendido' : 'Em recria';\n    if (!rounds.length) {\n      return { pesoAtual: null, diasMedidos: 0, gmdMedio: null, arrobasProduzidas: null, custoTotal: this.state.custos.filter(c => c.loteId === lote.id).reduce((s, c) => s + c.valor, 0), custoPorArroba: null, qtdAtual: lote.qtdInicial, status, rounds };\n    }\n    const last = rounds[rounds.length - 1];\n    const first = rounds[0];\n    const pesoAtual = last.avg;\n    const diasMedidos = this.daysBetween(first.date, last.date);\n    const gmdMedio = diasMedidos > 0 ? (pesoAtual - lote.pesoEntrada) / diasMedidos : null;\n    const qtdAtual = last.qty;\n    const arrobasProduzidas = (pesoAtual - lote.pesoEntrada) * qtdAtual / arroba;\n    const custoTotal = this.state.custos.filter(c => c.loteId === lote.id).reduce((s, c) => s + c.valor, 0);\n    const custoPorArroba = arrobasProduzidas ? custoTotal / arrobasProduzidas : null;\n    return { pesoAtual, diasMedidos, gmdMedio, arrobasProduzidas, custoTotal, custoPorArroba, qtdAtual, status, rounds };\n  }\n\n  computeCustoSummary() {\n    const custos = this.state.custos;\n    const byCat = {};\n    for (const c of custos) byCat[c.categoria] = (byCat[c.categoria] || 0) + c.valor;\n    const sup = (byCat['Fubá de Milho'] || 0) + (byCat['Soja'] || 0) + (byCat['Núcleo'] || 0) + (byCat['Ureia'] || 0);\n    const total = custos.reduce((s, c) => s + c.valor, 0);\n    const qtdAtiva = this.state.lotes.filter(l => !l.dataSaida).reduce((s, l) => s + (this.computeLoteMetrics(l).qtdAtual || 0), 0);\n    return { byCat, sup, total, custoPorAnimal: qtdAtiva ? total / qtdAtiva : null, custoSupPorAnimal: qtdAtiva ? sup / qtdAtiva : null };\n  }\n\n  computeVenda(lote) {\n    const m = this.computeLoteMetrics(lote);\n    const arroba = this.getPesoArroba();\n    const arrobasTotais = m.pesoAtual != null ? m.pesoAtual * m.qtdAtual / arroba : null;\n    const v = this.state.venda[lote.id] || { custoCompra: null, precoVenda: null };\n    const custoProducao = m.custoTotal;\n    const receitaTotal = (arrobasTotais != null && v.precoVenda) ? arrobasTotais * v.precoVenda : null;\n    const custoTotalGeral = custoProducao + (v.custoCompra || 0);\n    const lucroTotal = receitaTotal != null ? receitaTotal - custoTotalGeral : null;\n    const lucroPorAnimal = (lucroTotal != null && m.qtdAtual) ? lucroTotal / m.qtdAtual : null;\n    const margemPorArroba = (lucroTotal != null && arrobasTotais) ? lucroTotal / arrobasTotais : null;\n    return { arrobasTotais, arrobasProduzidas: m.arrobasProduzidas, custoProducao, custoCompra: v.custoCompra, precoVenda: v.precoVenda, receitaTotal, lucroTotal, lucroPorAnimal, margemPorArroba };\n  }\n\n  computeProjecao(lote, meses, novaTaxaProteinado) {\n    const m = this.computeLoteMetrics(lote);\n    const arroba = this.getPesoArroba();\n    const v = this.state.venda[lote.id] || { custoCompra: null, precoVenda: null };\n    if (m.pesoAtual == null || m.gmdMedio == null || !meses || meses <= 0) return null;\n    const dias = meses * 30;\n    const CAT_PROTEINADO = ['Fubá de Milho', 'Soja', 'Núcleo', 'Ureia'];\n    const custosLote = this.state.custos.filter(c => c.loteId === lote.id);\n    const custoProteinadoTotal = custosLote.filter(c => CAT_PROTEINADO.includes(c.categoria)).reduce((s, c) => s + c.valor, 0);\n    const custoOutroTotal = m.custoTotal - custoProteinadoTotal;\n    const custoProteinadoDiario = m.diasMedidos > 0 ? custoProteinadoTotal / m.diasMedidos : 0;\n    const custoOutroDiario = m.diasMedidos > 0 ? custoOutroTotal / m.diasMedidos : 0;\n    const taxaAtual = this.dataMod ? this.dataMod.METAS.supMin : 0.003;\n    const taxaNova = novaTaxaProteinado && novaTaxaProteinado > 0 ? novaTaxaProteinado : taxaAtual;\n    const fatorProteinado = taxaAtual > 0 ? taxaNova / taxaAtual : 1;\n    const custoProteinadoDiarioNovo = custoProteinadoDiario * fatorProteinado;\n    const custoDiarioMedio = custoOutroDiario + custoProteinadoDiarioNovo;\n    const pesoProjetado = m.pesoAtual + m.gmdMedio * dias;\n    const arrobasTotaisProjetadas = pesoProjetado * m.qtdAtual / arroba;\n    const custoAdicionalProjetado = custoDiarioMedio * dias;\n    const custoProducaoProjetado = m.custoTotal + custoAdicionalProjetado;\n    const receitaProjetada = v.precoVenda ? arrobasTotaisProjetadas * v.precoVenda : null;\n    const custoTotalGeralProjetado = custoProducaoProjetado + (v.custoCompra || 0);\n    const lucroProjetado = receitaProjetada != null ? receitaProjetada - custoTotalGeralProjetado : null;\n    return { meses, dias, pesoProjetado, arrobasTotaisProjetadas, custoAdicionalProjetado, custoProducaoProjetado, receitaProjetada, lucroProjetado, gmdMedio: m.gmdMedio, taxaAtual, taxaNova };\n  }\n\n  buildWeightChart(loteId) {\n    const width = 640, height = 220, padL = 44, padR = 16, padT = 16, padB = 34;\n    const rounds = this.computeRounds(loteId);\n    if (!rounds.length) return { dots: [], pointsStr: '', width, height, hasChart: false };\n    const weights = rounds.map(r => r.avg);\n    let min = Math.min(...weights), max = Math.max(...weights);\n    if (min === max) { min -= 5; max += 5; }\n    const innerW = width - padL - padR, innerH = height - padT - padB;\n    const xStep = rounds.length > 1 ? innerW / (rounds.length - 1) : 0;\n    const dots = rounds.map((r, i) => {\n      const x = padL + i * xStep;\n      const y = padT + innerH - ((r.avg - min) / (max - min)) * innerH;\n      return {\n        x: +x.toFixed(1), y: +y.toFixed(1), label: this.fmtMonthShort(r.date), value: this.fmtNum(r.avg, 0) + ' kg',\n        leftPct: +((x / width) * 100).toFixed(2), topPct: +((y / height) * 100).toFixed(2), labelTopPct: +((height - 12) / height * 100).toFixed(2)\n      };\n    });\n    const pointsStr = dots.map(d => `${d.x},${d.y}`).join(' ');\n    const yLabels = [\n      { text: this.fmtNum(max, 0) + ' kg', topPct: +((padT) / height * 100).toFixed(2) },\n      { text: this.fmtNum(min, 0) + ' kg', topPct: +((padT + innerH) / height * 100).toFixed(2) }\n    ];\n    return { dots, pointsStr, width, height, yLabels, baselineY: padT + innerH, rightX: width - padR, hasChart: dots.length > 1 };\n  }\n\n  buildCostBarChart(loteId) {\n    const width = 640, height = 220, padL = 50, padR = 16, padT = 16, padB = 40;\n    const rounds = this.computeRounds(loteId).filter(r => r.custoPorArroba != null);\n    if (!rounds.length) return { bars: [], width, height, baselineY: height - padB, rightX: width - padR };\n    const values = rounds.map(r => r.custoPorArroba);\n    const max = Math.max(...values, 1);\n    const innerW = width - padL - padR, innerH = height - padT - padB;\n    const slot = innerW / rounds.length;\n    const gap = Math.min(10, slot * 0.2);\n    const barW = Math.max(slot - gap, 4);\n    const bars = rounds.map((r, i) => {\n      const h = (r.custoPorArroba / max) * innerH;\n      const x = padL + i * slot + gap / 2;\n      const y = padT + innerH - h;\n      const midX = x + barW / 2;\n      return { x: +x.toFixed(1), y: +y.toFixed(1), w: +barW.toFixed(1), h: +h.toFixed(1), midX: +midX.toFixed(1), midXPct: +((midX / width) * 100).toFixed(2), labelTopPct: +(((padT + innerH) / height) * 100).toFixed(2), label: 'R' + r.round, value: this.fmtMoney(r.custoPorArroba) };\n    });\n    return { bars, width, height, baselineY: padT + innerH, rightX: width - padR };\n  }\n\n  // ---- pesagens quick entry ----\n  prefillPesoInputs(loteId, date) {\n    const existing = this.state.pesagens.filter(p => p.loteId === loteId && p.data === date);\n    const map = {};\n    existing.forEach(e => { map[e.animal] = String(e.peso); });\n    return map;\n  }\n  getAnimaisDoLote(loteId) {\n    const set = new Set(this.state.pesagens.filter(p => p.loteId === loteId).map(p => p.animal));\n    return Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));\n  }\n  onChangeNovaPesagemData(e) {\n    const v = e.target.value;\n    this.setState(s => ({ novaPesagemData: v, pesoInputs: this.prefillPesoInputs(s.novaPesagemLote, v) }));\n  }\n  onChangeNovaPesagemLote(e) {\n    const v = e.target.value;\n    this.setState(s => ({ novaPesagemLote: v, pesoInputs: this.prefillPesoInputs(v, s.novaPesagemData) }));\n  }\n  setPesoInput(animal, val) { this.setState(s => ({ pesoInputs: { ...s.pesoInputs, [animal]: val } })); }\n  addNovoAnimalRow() { this.setState(s => ({ novosAnimais: [...s.novosAnimais, { key: this.genId('na'), nome: '', peso: '' }] })); }\n  updateNovoAnimal(key, field, val) { this.setState(s => ({ novosAnimais: s.novosAnimais.map(n => n.key === key ull, qtdInicial: parseInt(m.qtdInicial) || 0,\n      pesoEntrada: parseFloat(String(m.pesoEntrada).replace(',', '.')) || 0,\n      categoria: m.categoria || '', piquete: m.piquete || '',\n      pesoSaida: m.pesoSaida ? parseFloat(String(m.pesoSaida).replace(',', '.')) : null,\n      dataSaida: m.dataSaida || null, obs: m.obs || ''\n    };\n    let lotes = [...this.state.lotes];\n    if (m.isNew) { if (lotes.some(x => x.id === lote.id)) return; lotes.push(lote); }\n    else { lotes = lotes.map(x => x.id === m.id ? lote : x); }\n    this.setState({ lotes, loteModal: null });\n    this.showToast(`Lote ${lote.id} ${m.isNew ? 'criado' : 'atualizado'} — ${lote.qtdInicial} animais, ${this.fmtNum(lote.pesoEntrada, 1)}kg entrada`);\n    this.persist();\n  }\n  askDeleteLote(l) { this.setState({ confirmDelete: { type: 'lote', id: l.id, label: `Lote ${l.id}` } }); }\n\n  // ---- custos CRUD ----\n  openNovoCusto() { this.setState({ custoModal: { id: null, data: this.todayISO(), loteId: (this.state.lotes[0] && this.state.lotes[0].id) || '', categoria: 'Outros', descricao: '', valor: '', quantidadeKg: '', numSacos: '', kgPorSaco: '', valorPorSaco: '', localCompra: '', modo: 'valor', valorSacosModo: 'total', isNew: true } }); }\n  openEditCusto(c) { this.setState({ custoModal: { ...c, valor: String(c.valor), quantidadeKg: c.quantidadeKg != null ? String(c.quantidadeKg) : '', numSacos: c.numSacos != null ? String(c.numSacos) : '', kgPorSaco: c.kgPorSaco != null ? String(c.kgPorSaco) : '', valorPorSaco: c.valorPorSaco != null ? String(c.valorPorSaco) : '', localCompra: c.localCompra || '', modo: c.numSacos != null ? 'sacos' : (c.quantidadeKg != null ? 'porTotal' : 'valor'), valorSacosModo: c.valorPorSaco != null ? 'porSaco' : 'total', isNew: false } }); }\n  closeCustoModal() { this.setState({ custoModal: null }); }\n  updateCustoModalField(field, val) { this.setState(s => ({ custoModal: { ...s.custoModal, [field]: val } })); }\n  getCustoModalSacosCalc() {\n    const m = this.stat
